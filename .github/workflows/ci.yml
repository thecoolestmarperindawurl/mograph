name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg + voice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Doctor
        run: node skills/motion-video/scripts/mograph.mjs doctor
      - name: Lint every example
        shell: bash
        run: for f in examples/*.yaml examples/lanhmar/*.yaml; do node skills/motion-video/scripts/mograph.mjs lint "$f" | head -3; done
      - name: Render (slides, music)
        run: node skills/motion-video/scripts/mograph.mjs render examples/ai-agent-explainer.yaml --draft --scenes 1-3 -o out-slides.mp4
      - name: Render (desk camera, beat sync)
        run: node skills/motion-video/scripts/mograph.mjs render examples/workshop-invite.yaml --draft -o out-desk.mp4
      - name: Render (footage + voice + captions)
        run: node skills/motion-video/scripts/mograph.mjs render examples/feature-tour.yaml --draft -o out-features.mp4
      - name: Render (looks + new scenes)
        run: node skills/motion-video/scripts/mograph.mjs render examples/fx-showcase.yaml --draft --scenes 1-4 -o out-fx.mp4
      - name: Remix sheet
        run: node skills/motion-video/scripts/mograph.mjs remix examples/fx-showcase.yaml --looks glitch,cinematic -o out-remix.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-${{ matrix.os }}
          path: |
            out-*.mp4
            out-*.jpg
          if-no-files-found: ignore
