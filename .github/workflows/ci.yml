name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg + voice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        # pinned: with ffmpeg 9.1 `mograph jumpcut` never finishes on Windows (encode emits no frame); unpin once fixed
        run: choco install ffmpeg --version 9.0.2 -y --no-progress
      - name: Doctor
        run: node skills/motion-video/scripts/mograph.mjs doctor
      - name: Lint every example
        shell: bash
        run: for f in examples/*.yaml examples/lanhmar/*.yaml examples/aroll/*.yaml; do node skills/motion-video/scripts/mograph.mjs lint "$f" | head -3; done
      - name: Render (slides, music)
        run: node skills/motion-video/scripts/mograph.mjs render examples/ai-agent-explainer.yaml --draft --scenes 1-3 -o out-slides.mp4
      - name: Render (desk camera, beat sync)
        run: node skills/motion-video/scripts/mograph.mjs render examples/workshop-invite.yaml --draft -o out-desk.mp4
      - name: Render (footage + voice + captions)
        run: node skills/motion-video/scripts/mograph.mjs render examples/feature-tour.yaml --draft -o out-features.mp4
      - name: Render (looks + new scenes)
        run: node skills/motion-video/scripts/mograph.mjs render examples/fx-showcase.yaml --draft --scenes 1-4 -o out-fx.mp4
      - name: Render (3D scenes, extras)
        run: node skills/motion-video/scripts/mograph.mjs render examples/v07-3d.yaml --draft --thumb --gif -o out-3d.mp4
      - name: "Render (studio pack: cutouts, emoji, flood)"
        run: node skills/motion-video/scripts/mograph.mjs render examples/studio-reel.yaml --draft -o out-studio.mp4
      - name: "Render (A-roll: real footage + voice, transcript, marks)"
        run: node skills/motion-video/scripts/mograph.mjs render examples/aroll/aroll-talk.yaml --draft -o out-aroll.mp4
      - name: Jump cut
        timeout-minutes: 5
        run: node skills/motion-video/scripts/mograph.mjs jumpcut examples/aroll/talk.mp4 -o out-cut.mp4
      - name: "OpenMontage add-on (Linux): setup + scene detection + voice cleanup"
        if: runner.os == 'Linux'
        run: |
          node skills/motion-video/scripts/mograph.mjs openmontage setup
          node skills/motion-video/scripts/mograph.mjs om scenes --input_path examples/aroll/talk.mp4
          node skills/motion-video/scripts/mograph.mjs om enhance --input_path examples/aroll/talk.mp4 --preset clean_speech -o out-clean.mp4
      - name: Remix sheet
        run: node skills/motion-video/scripts/mograph.mjs remix examples/fx-showcase.yaml --looks glitch,cinematic -o out-remix.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-${{ matrix.os }}
          path: |
            out-*.mp4
            out-*.jpg
            out-*.gif
            out-*.srt
          if-no-files-found: ignore
