# A-roll: your real video with real voice is the timeline; graphics cut in at spoken phrases.
# talk.mp4 here is a stand-in (screen recording + piper TTS voice; talk.srt has its exact sentence timings). Use your own: talking head, screen recording, podcast clip.
# talk.srt = subtitles exported from CapCut/Premiere/YouTube or `mograph transcribe talk.mp4` (or script.txt → aligned to pauses).
meta:
  sizes: ["9:16", "16:9"]
  theme: studio
  look: studio
  aroll: talk.mp4
  transcript: talk.srt
  music: chill
scenes:
  - aroll: "Một câu lệnh / & thứ mình nhận được"
    num: 1
    image: ../lanhmar/assets/tool-ai-convert.jpg
  - hook: "Dán *kịch bản* / vào Claude"
    at: "mình chỉ dán"
    pip: true
  - aroll: ""
    at: "AI tự viết"
    zoom: 1.12
    freeze: true
    marks: ["circle 42 57.5 16 9", "arrow 63 51 56.5 58", "text 61 47 bấm là chạy"]
  - image: ../lanhmar/assets/shot-kho-bau-m.jpg
    title: "*Kho báu* công cụ miễn phí"
    at: "kho báu"
    pip: true
  - image: ../lanhmar/assets/shot-storage.jpg
    title: "*Storage* tài liệu gọn gàng"
    at: "còn storage"
  - cta: Muốn *thử* không?
    handle: lanhmar.id.vn
    at: "muốn thử"
