# A-roll: your real video with real voice is the timeline; graphics cut in at spoken phrases.
# talk.mp4 here is a stand-in (screen recording + TTS voice). Use your own: talking head, screen recording, podcast clip.
# talk.srt = subtitles exported from CapCut/Premiere/YouTube or `mograph transcribe talk.mp4` (or script.txt → aligned to pauses).
meta:
  size: "9:16"
  theme: studio
  look: studio
  aroll: talk.mp4
  transcript: talk.srt
  music: chill
